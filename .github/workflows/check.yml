name: Music plugins
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify committed download packages match source
        run: git diff --exit-code -- packages/
      - uses: actions/upload-artifact@v4
        with:
          name: music-source-plugins
          path: packages/
  # Each new package.json version merged into main becomes a v<version> Release
  # carrying the same packages the catalog serves; an existing tag is left alone.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish the packaged version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; skipping."
            exit 0
          fi
          prerelease=()
          [[ "$tag" == *-* ]] && prerelease=(--prerelease)
          gh release create "$tag" packages/qq.laplugin packages/netease.laplugin \
            --target "$GITHUB_SHA" --title "$tag" --generate-notes "${prerelease[@]}"
