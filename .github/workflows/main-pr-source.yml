name: Main PR source
# main only takes pull requests from this repository's dev branch. The job below
# is a required status check on main, so any other source cannot be merged.
# pull_request_target runs the copy of this file on main, so a pull request
# cannot weaken the rule by editing it. No pull request code is checked out.
on:
  pull_request_target:
    branches: [main]
permissions: {}
jobs:
  from-dev:
    name: PR to main comes from dev
    runs-on: ubuntu-latest
    steps:
      - name: Require the dev branch of this repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ] || [ "$HEAD_REF" != "dev" ]; then
            echo "::error::main only accepts pull requests from $BASE_REPO:dev (got $HEAD_REPO:$HEAD_REF). Target dev instead."
            exit 1
          fi
